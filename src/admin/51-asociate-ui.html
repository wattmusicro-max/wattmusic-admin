<!-- wm-asoc-ui (06.11.2026) -->
<style>
#wmAs .sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 16px}
#wmAs .sum div{border:1px solid #e6e6ea;border-radius:14px;padding:12px 14px;background:#fafafa}
#wmAs .sum small{display:block;font:800 11.5px/1.3 "Open Sans",sans-serif;color:#6b6b76;text-transform:uppercase;letter-spacing:.03em}
#wmAs .sum b{display:block;font:800 22px/1.2 "Open Sans",sans-serif;margin-top:4px}
#wmAs .sum .bal{background:#16161a;border-color:#16161a;color:#fff}
#wmAs .sum .bal small{color:#d4d4da}#wmAs .sum .bal b{color:#f5d90a}
#wmAs h3{margin:18px 0 8px;font:700 15px/1.3 "Lexend Deca",sans-serif}
#wmAs .tw{overflow-x:auto}
#wmAs table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
#wmAs th,#wmAs td{padding:7px 6px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
#wmAs th{font-size:11px;color:#6b6b76;text-transform:uppercase;letter-spacing:.03em}
#wmAs td input{width:100%;box-sizing:border-box;border:1px solid #e1e1e6;border-radius:8px;padding:6px 7px;font:13px "Open Sans",sans-serif;background:#fff}
#wmAs td input.nm{text-align:right}
#wmAs td.c{text-align:right;font-weight:800;white-space:nowrap}
#wmAs td.pos{color:#1e7b34}#wmAs td.neg{color:#b42318}
#wmAs .x{border:0;background:none;cursor:pointer;font-size:15px;color:#b42318}
#wmAs .act{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0;align-items:center}
#wmAs .act .bt{width:auto;padding:11px 16px;font-size:13.5px}
#wmAs .ms{font-size:13px;color:#6b6b76;font-weight:700}
#wmAs .todo{background:#fff9e0;border:1px solid #f3dc6a;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.55;margin:14px 0 0}
#wmAs .todo textarea{width:100%;box-sizing:border-box;min-height:90px;border:1px solid #e9d36b;border-radius:10px;padding:8px;font:13.5px "Open Sans",sans-serif;background:#fffdf3}
@media(max-width:760px){#wmAs .sum{grid-template-columns:1fr}}
</style>
<script>
window.WM_ASOC_UI=function(el,D,save){
 D=D||{};D.v=2;D.split=D.split||50;D.items=D.items||[];D.pays=D.pays||[];D.todo=D.todo||'';
 function n(v){return Number(String(v==null?'':v).replace(/\s/g,'').replace(',','.'))||0}
 function f0(v){return Math.round(v).toLocaleString('ro-RO')}
 function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
 function uid(){return Math.random().toString(36).slice(2,9)}
 function calc(){var M=0,E=0,P=0;D.items.forEach(function(i){M+=n(i.m);E+=n(i.e);P+=n(i.p)});var pm=D.split/100,tot=M+E,dueM=tot*pm,bal=M-dueM;
  D.pays.forEach(function(p){if(p.dir==='me')bal-=n(p.a);else bal+=n(p.a)});return {M:M,E:E,P:P,tot:tot,bal:bal}}
 function draw(){var c=calc();var who=Math.abs(c.bal)<1?'Sunteți chit ✓':c.bal>0?'Mada îi dă Elenei':'Elena îi dă Madei';
  var h='<div class="sum"><div class="bal"><small>Sold acum</small><b>'+(Math.abs(c.bal)<1?'0 €':f0(Math.abs(c.bal))+' €')+'</b><small>'+who+'</small></div><div><small>Comision încasat · total</small><b>'+f0(c.tot)+' €</b><small>Mada '+f0(c.M)+' € · Elena '+f0(c.E)+' € · împărțire '+D.split+' / '+(100-D.split)+'</small></div><div><small>De încasat ulterior (agenție)</small><b>'+f0(c.P)+' €</b><small>avansuri viitoare + recuperări după evenimente</small></div></div>';
  h+='<h3>Contracte · comisionul agenției și cine îl ține</h3><div class="tw"><table><thead><tr><th style="width:21%">Contract</th><th style="width:9%">Comision total</th><th style="width:9%">La Mada</th><th style="width:9%">La Elena</th><th style="width:9%">De încasat</th><th style="width:9%">Diferență</th><th>Notă</th><th></th></tr></thead><tbody>'+
  D.items.map(function(i,ix){var d=n(i.m)-(n(i.m)+n(i.e))*D.split/100;return '<tr data-i="'+ix+'"><td><input data-k="t" value="'+e(i.t)+'"></td><td><input class="nm" data-k="c" value="'+e(i.c)+'"></td><td><input class="nm" data-k="m" value="'+e(i.m)+'"></td><td><input class="nm" data-k="e" value="'+e(i.e)+'"></td><td><input class="nm" data-k="p" value="'+e(i.p)+'"></td><td class="c '+(d>0.5?'neg':d<-0.5?'pos':'')+'">'+(Math.abs(d)<0.5?'0':(d>0?'M→E ':'E→M ')+f0(Math.abs(d)))+'</td><td><input data-k="n" value="'+e(i.n)+'"></td><td><button type="button" class="x" data-del="'+ix+'">✕</button></td></tr>'}).join('')+
  '</tbody></table></div><div class="act"><button type="button" class="bt l addi">+ Contract</button></div>';
  h+='<h3>Decontări între voi</h3><div class="tw"><table style="min-width:560px"><thead><tr><th style="width:16%">Data</th><th style="width:22%">Cine a dat</th><th style="width:14%">Suma €</th><th>Notă</th><th></th></tr></thead><tbody>'+
  D.pays.map(function(p,ix){return '<tr data-p="'+ix+'"><td><input data-k="d" value="'+e(p.d)+'" placeholder="zz.ll.aaaa"></td><td><select data-k="dir" style="width:100%;border:1px solid #e1e1e6;border-radius:8px;padding:6px"><option value="me"'+(p.dir==='me'?' selected':'')+'>Mada → Elena</option><option value="em"'+(p.dir==='em'?' selected':'')+'>Elena → Mada</option></select></td><td><input class="nm" data-k="a" value="'+e(p.a)+'"></td><td><input data-k="n" value="'+e(p.n)+'"></td><td><button type="button" class="x" data-delp="'+ix+'">✕</button></td></tr>'}).join('')+
  '</tbody></table></div><div class="act"><button type="button" class="bt l addp">+ Decontare</button></div>';
  h+='<div class="todo"><b>📝 De lămurit / note</b><textarea class="td">'+e(D.todo)+'</textarea></div>';
  h+='<div class="act"><button type="button" class="bt sv">💾 Salvează</button><span class="ms"></span><span style="margin-left:auto;font-size:12.5px;color:#6b6b76">Împărțire Mada / Elena: <input class="spl" value="'+D.split+'" style="width:52px;border:1px solid #d4d4da;border-radius:8px;padding:5px;text-align:center"> %</span></div>';
  el.innerHTML=h;
  el.querySelectorAll('tr[data-i] input').forEach(function(x){x.onchange=function(){var i=D.items[+x.closest('tr').getAttribute('data-i')];i[x.getAttribute('data-k')]=x.value;dirty();draw()}});
  el.querySelectorAll('tr[data-p] input,tr[data-p] select').forEach(function(x){x.onchange=function(){var p=D.pays[+x.closest('tr').getAttribute('data-p')];p[x.getAttribute('data-k')]=x.value;dirty();draw()}});
  el.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){if(!confirm('Ștergi rândul?'))return;D.items.splice(+b.getAttribute('data-del'),1);dirty();draw()}});
  el.querySelectorAll('[data-delp]').forEach(function(b){b.onclick=function(){D.pays.splice(+b.getAttribute('data-delp'),1);dirty();draw()}});
  el.querySelector('.addi').onclick=function(){D.items.push({id:uid(),t:'',c:'',m:'',e:'',p:'',n:''});dirty();draw()};
  el.querySelector('.addp').onclick=function(){var d=new Date();D.pays.push({d:('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear(),dir:'me',a:'',n:''});dirty();draw()};
  el.querySelector('.td').oninput=function(){D.todo=this.value;dirty()};
  el.querySelector('.spl').onchange=function(){D.split=Math.max(0,Math.min(100,n(this.value)||50));dirty();draw()};
  el.querySelector('.sv').onclick=function(){var m=el.querySelector('.ms');m.textContent='Se salvează…';save(D).then(function(){DIRTY=false;m.textContent='Salvat ✓ (criptat)'}).catch(function(){m.textContent='Nu s-a salvat – încearcă din nou'})};
  if(DIRTY)el.querySelector('.ms').textContent='Modificări nesalvate';}
 var DIRTY=false;function dirty(){DIRTY=true;var m=el.querySelector('.ms');if(m)m.textContent='Modificări nesalvate'}
 draw()};
</script>
