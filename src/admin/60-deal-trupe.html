<!-- wm-deals (06.11.2026) -->
<style>
#wmDl{color:#16161a}
#wmDl .dh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
#wmDl .dh h2{margin:0;font:600 24px/1.2 "Lexend Deca","Lexend-Deca",sans-serif}
#wmDl .dh p{margin:4px 0 0;color:#6b6b76;font-size:13.5px}
#wmDl .sumt{background:#fff;border:1px solid #e6e6ea;border-radius:18px;padding:6px 16px;margin:0 0 16px;box-shadow:0 6px 20px -16px rgba(0,0,0,.25)}
#wmDl .sumt table{width:100%;border-collapse:collapse;font-size:14.5px}
#wmDl .sumt td{padding:11px 4px;border-bottom:1px solid #eee}
#wmDl .sumt tr:last-child td{border-bottom:0}
#wmDl .sumt td.v{text-align:right;font-weight:800;white-space:nowrap}
#wmDl .sumt td small{color:#6b6b76;font-weight:600}
#wmDl .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#wmDl .bc{background:#fff;border:1px solid #e6e6ea;border-radius:18px;padding:16px 18px;box-shadow:0 6px 20px -16px rgba(0,0,0,.25)}
#wmDl .bc .t{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:0 0 4px}
#wmDl .bc h3{margin:0;font:700 17px/1.25 "Lexend Deca",sans-serif}
#wmDl .bc .tot{background:#16161a;color:#f5d90a;border-radius:999px;padding:7px 12px;font:800 15px/1 "Open Sans",sans-serif;white-space:nowrap}
#wmDl .bc .tot.e{background:#fff9e0;color:#7a5b00;border:1px solid #f3dc6a}
#wmDl .bc .s{color:#6b6b76;font-size:12.5px;font-weight:700;margin:0 0 10px}
#wmDl .bc table{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 10px}
#wmDl .bc td{padding:6px 0;border-bottom:1px dashed #e6e6ea}
#wmDl .bc td.v{text-align:right;font-weight:700;white-space:nowrap;padding-left:10px}
#wmDl .bc ul{margin:0;padding:0 0 0 18px;font-size:13.5px;line-height:1.55;color:#3a3a46}
#wmDl .bc .lb{font:800 11.5px/1 "Open Sans",sans-serif;color:#6b6b76;text-transform:uppercase;letter-spacing:.04em;margin:8px 0 6px}
#wmDl .rule{background:#fff9e0;border:1px solid #f3dc6a;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin:16px 0 0;color:#5c4500}
@media(max-width:760px){#wmDl .grid{grid-template-columns:1fr}}
</style>
<script>
(function(){
var CFG={url:'https://zillhgmbhwurnmtssmqx.supabase.co',key:'sb_publishable_wUOg2nD0rwVt8q8sXpkTZQ_z2xTeVpt'};
function sess(){var S={};try{S=JSON.parse(sessionStorage.getItem('wm-tm-adm')||localStorage.getItem('wm-tm-adm')||'{}')||{}}catch(_){}
 if(!S.at)return Promise.reject('login');if(S.exp&&Date.now()<S.exp)return Promise.resolve(S.at);
 return fetch(CFG.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':CFG.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.rt})}).then(function(r){return r.json()}).then(function(j){if(!j.access_token)throw 'login';var N=Object.assign({},S,{at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000-60000});try{sessionStorage.setItem('wm-tm-adm',JSON.stringify(N))}catch(_){}return N.at})}
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function draw(D){var r=document.getElementById('wmDl');if(!r)return;var B=D.bands||[];
 var h='<div class="dh"><div><h2>🤝 Deal-uri standard trupe</h2><p>'+e(D.note||'')+' · actualizat '+e(D.upd||'')+'</p></div></div>';
 h+='<div class="sumt"><table>'+B.map(function(b){return '<tr><td><b>'+e(b.n)+'</b>'+(b.sub?' <small>· '+e(b.sub)+'</small>':'')+'</td><td class="v">'+e(b.total)+'</td></tr>'}).join('')+'</table></div>';
 h+='<div class="grid">'+B.map(function(b){var emp=/completat/.test(b.total);return '<div class="bc"><div class="t"><h3>'+e(b.n)+'</h3><span class="tot'+(emp?' e':'')+'">'+e(b.total)+'</span></div>'+(b.sub?'<div class="s">'+e(b.sub)+'</div>':'')+
  (b.rows&&b.rows.length?'<table>'+b.rows.map(function(x){return '<tr><td>'+e(x[0])+'</td><td class="v">'+e(x[1])+'</td></tr>'}).join('')+'</table>':'')+
  (b.inc&&b.inc.length?'<div class="lb">Ce include</div><ul>'+b.inc.map(function(x){return '<li>'+e(x)+'</li>'}).join('')+'</ul>':'')+(emp?'<div class="s">Spune-mi deal-ul și îl completez.</div>':'')+'</div>'}).join('')+'</div>';
 h+='<div class="rule">💡 '+e(D.rule||'')+'</div>';r.innerHTML=h}
function load(){sess().then(function(at){return fetch(CFG.url+'/rest/v1/offers?mode=eq.deals&select=notes&limit=1',{headers:{'apikey':CFG.key,'Authorization':'Bearer '+at}}).then(function(r){return r.json()})}).then(function(r){var D={};try{D=JSON.parse((r&&r[0]&&r[0].notes)||'{}')}catch(_){}draw(D)}).catch(function(){var x=document.getElementById('wmDl');if(x)x.innerHTML='<p style="color:#888">Autentifică-te în admin.</p>'})}
function init(){var r=document.getElementById('wmDl');if(!r)return setTimeout(init,500);r.innerHTML='<p style="color:#888">Se încarcă…</p>';
 var b=document.querySelector('.wm-ad .tabsA button[data-sec="dl"]');if(b)b.addEventListener('click',load);
 var t=0,w=setInterval(function(){if(++t>40)return clearInterval(w);sess().then(function(){clearInterval(w);load()}).catch(function(){})},1500)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
