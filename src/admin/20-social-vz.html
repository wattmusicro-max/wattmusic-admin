<style>

function fixTT(img){var id=img.getAttribute('data-fix');var p=P.filter(function(x){return x.id===id})[0];if(!p||img._f)return;img._f=1;if(!(p.urls&&p.urls.tiktok)){img.style.backgroundImage='';return}ttThumb(p.urls.tiktok).then(function(u){if(!u)return;p.thumb=u;img.style.backgroundImage='url("'+u+'")';api('/rest/v1/social_posts?id=eq.'+p.id,{m:'PATCH',b:{thumb:u}}).catch(function(){})})}
function card(p){var t=thumbOf(p),w=warns(p),ps=pls(p);
 return '<div class="pc"><div class="th'+(t?'':' ph')+'" '+(t?'style="background-image:url(&quot;'+esc(t)+'&quot;)" data-fix="'+esc(p.id)+'" data-src="'+esc(t)+'"':'')+'>'+(t?'':esc(p.title||'Fără imagine'))+'<div class="pls">'+ps.map(function(k){return '<a href="'+esc(p.urls[k])+'" target="_blank" rel="noopener">'+PL[k]+'</a>'}).join('')+'</div>'+(p.posted_at?'<span class="dt">'+fd(p.posted_at)+'</span>':'')+(w.length?'<span class="wr" title="'+esc(w.map(function(x){return x[1]}).join(' · '))+'">⚠️ repetă</span>':'')+'</div>'+
 '<div class="pb">'+(p.title?'<b>'+esc(p.title)+'</b>':'')+'<div class="tags">'+(p.band?'<span class="bd">'+esc(p.band)+'</span>':'')+(p.kind?'<span>'+esc(p.kind)+'</span>':'')+(p.angle?'<span>'+esc(p.angle)+'</span>':'')+'</div>'+(p.song?'<div>🎵 '+esc(p.song)+'</div>':'')+(p.views?'<div>👁 '+Number(p.views).toLocaleString('ro-RO')+'</div>':'')+'<div class="acts"><button type="button" data-a="ed" data-id="'+esc(p.id)+'">Modifică</button></div></div></div>'}
function item(p){var t=thumbOf(p),w=warns(p);
 return '<div class="ii"><div class="mini" '+(t?'style="background-image:url(&quot;'+esc(t)+'&quot;)"':'')+'>'+(t?'':(p.status==='idee'?'💡':'🎬'))+'</div><div class="tx"><b>'+esc(p.title||'(fără titlu)')+'</b><div class="tags" style="margin:5px 0">'+(p.band?'<span class="bd">'+esc(p.band)+'</span>':'')+(p.kind?'<span>'+esc(p.kind)+'</span>':'')+(p.angle?'<span>'+esc(p.angle)+'</span>':'')+(p.planned_at?'<span>📅 '+fd(p.planned_at)+'</span>':'')+pls(p).map(function(k){return '<span>'+PL[k]+'</span>'}).join('')+'</div>'+(p.song?'<div>🎵 '+esc(p.song)+'</div>':'')+(p.notes?'<div style="color:#3a3a46;white-space:pre-wrap">'+esc(p.notes)+'</div>':'')+w.map(function(x){return '<div class="warn'+(x[0]==='y'?' y':'')+'" style="margin-top:6px">⚠️ '+esc(x[1])+'</div>'}).join('')+
 '<div class="acts" style="max-width:420px"><button type="button" data-a="ed" data-id="'+esc(p.id)+'">Modifică</button>'+(p.status==='idee'?'<button type="button" data-a="prep" data-id="'+esc(p.id)+'">🎬 Pregătit</button>':'')+'<button type="button" class="go" data-a="post" data-id="'+esc(p.id)+'">✅ Am postat</button></div></div></div>'}
function draw(){if(!shell())return;var r=document.getElementById('wmSoc');
 if(MISSING){$('.lst').innerHTML='<div class="err">Secțiunea e gata, dar tabelul din baza de date nu e încă creat. Rulează scriptul SQL pregătit în Supabase (SQL Editor → Run), apoi reîncarcă pagina.</div>';return}
 var T=today(),posted=P.filter(function(p){return p.status==='postat'&&p.posted_at});
 $('.bal').innerHTML=BANDS.map(function(b){var l=posted.filter(function(p){return p.band===b}),n=l.filter(function(p){return dd(p.posted_at,T)<=30}).length,last=l.map(function(p){return p.posted_at}).sort().pop();var since=last?dd(last,T):null;var cls=since===null||since>14?'cold':since<=2?'hot':'';
  return '<div class="'+cls+'"><b>'+esc(b)+'</b><i>'+n+'</i><small>'+(last?'ultima: '+ago(last):'nimic postat')+'</small></div>'}).join('');
 var pc={};Object.keys(PL).forEach(function(k){pc[k]=posted.filter(function(p){return p.urls&&p.urls[k]&&dd(p.posted_at,T)<=30}).length});
 $('.pfc').innerHTML=Object.keys(PL).map(function(k){return '<span>'+PL[k]+': '+pc[k]+' în 30 de zile</span>'}).join('')+'<span>💡 '+P.filter(function(p){return p.status==='idee'}).length+' idei · 🎬 '+P.filter(function(p){return p.status==='pregatit'}).length+' pregătite</span>';
 var st=new Date();st.setDate(st.getDate()-14);st.setDate(st.getDate()-((st.getDay()+6)%7));var h=['L','Ma','Mi','J','V','S','D'].map(function(x){return '<div style="min-height:0;border:0;text-align:center;font-weight:800;color:#6b6b76;background:none">'+x+'</div>'}).join('');
 for(var i=0;i<28;i++){var dt=new Date(st);dt.setDate(st.getDate()+i);var ds=iso(dt);var ev=P.filter(function(p){return (p.status==='postat'&&p.posted_at===ds)||(p.status!=='postat'&&p.planned_at===ds)});
  h+='<div class="'+(ds===T?'td':ds<T?'ps':'')+'"><small>'+dt.getDate()+'.'+(dt.getMonth()+1)+'</small>'+ev.map(function(p){return '<span class="'+(p.status==='postat'?'p':'q')+'" title="'+esc(p.title||'')+'">'+esc(p.band||p.title||'•')+'</span>'}).join('')+'</div>'}
 $('.cal').innerHTML=h;
 var fp=$('.x_pl').value,fb=$('.x_band').value,fk=$('.x_kind').value,q=$('.x_q').value.trim().toLowerCase();
 var L=P.filter(function(p){return p.status===TAB&&(!fp||(p.urls&&p.urls[fp]))&&(!fb||p.band===fb)&&(!fk||p.kind===fk)&&(!q||[p.title,p.song,p.notes,p.band,p.kind,p.angle].join(' ').toLowerCase().indexOf(q)>-1)});
 if(TAB==='postat')L.sort(function(a,b){return (b.posted_at||'').localeCompare(a.posted_at||'')});else L.sort(function(a,b){return (a.planned_at||'9999').localeCompare(b.planned_at||'9999')});
 $('.lst').innerHTML=L.length?(TAB==='postat'?'<div class="grid">'+L.map(card).join('')+'</div>':'<div class="ilist">'+L.map(item).join('')+'</div>'):'<div class="emp">'+(TAB==='postat'?'Nicio postare încă. Apasă „+ Adaugă postare sau idee” și lipește linkul.':TAB==='idee'?'Nicio idee încă.':'Nimic pregătit încă.')+'</div>';
 [].forEach.call(r.querySelectorAll('.lst [data-src]'),function(el){var im=new Image();im.onerror=function(){fixTT(el)};im.src=el.getAttribute('data-src')})}
function load(){if(BUSY)return;BUSY=true;api('/rest/v1/social_posts?select=*&order=created_at.desc').then(function(r){P=r||[];MISSING=false;BUSY=false;draw()}).catch(function(e){BUSY=false;if(e&&(e.s===404||/social_posts/.test(e.t||'')))MISSING=true;draw()})}
function init(){var r=document.getElementById('wmSoc');if(!r)return setTimeout(init,500);shell();
 var btn=document.querySelector('.wm-ad .tabsA button[data-sec="soc"]');if(btn)btn.addEventListener('click',function(){load()});
 var t=0,w=setInterval(function(){if(++t>40)return clearInterval(w);sess().then(function(){clearInterval(w);load()}).catch(function(){})},1500)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
