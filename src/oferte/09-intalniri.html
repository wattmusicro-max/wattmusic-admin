<script>
(function(){

 var c0=tr.children[0];if((meet||o.meet_at||o.meet_link)&&c0){var cf=Object.keys(o.meet_confirm||{});var d=document.createElement('div');d.className='mtl';d.innerHTML=(meet?'💻 <b>Invitație la întâlnire</b>':'💻 <b>Întâlnire programată · cu prețuri</b>')+(o.meet_at?' · '+esc(fdt(o.meet_at)):' · fără dată')+(o.meet_platform?' · '+esc(o.meet_platform):'')+'<br>'+(cf.length?'✅ Au confirmat: <b>'+esc(cf.join(', '))+'</b>':'⏳ Încă n-au confirmat')+(o.meet_link?'<br><a href="'+esc(o.meet_link)+'" target="_blank" rel="noopener" style="display:inline-block;margin-top:8px;background:#1a73e8;color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;text-decoration:none">🎥 Intră în întâlnire</a> <a href="'+esc(o.meet_link)+'" target="_blank" rel="noopener" style="font-size:11px;color:#1a73e8;word-break:break-all">'+esc(o.meet_link)+'</a>':'<br><span style="font-size:11px;color:#b45309">Fără link de întâlnire – adaugă-l din Modifică</span>');var b0=c0.querySelector('b');c0.insertBefore(d,b0?b0.nextSibling:c0.firstChild)}

 var td=tr.lastElementChild;if(!td)return;var b=document.createElement('button');b.type='button';b.className='mtb';b.textContent=meet?'📅 Întâlnirea (invitație)':(o.meet_at||o.meet_link?'📅 Întâlnirea programată':'📅 Programează întâlnire');var box=document.createElement('div');td.appendChild(document.createElement('div'));td.appendChild(b);td.appendChild(box);
 b.addEventListener('click',function(){if(box.innerHTML){box.innerHTML='';box.className='';return}box.className='mtf';box.innerHTML='<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" class="mm" style="width:16px;height:16px"'+(meet?' checked':'')+'> <span style="margin:0">Ascunde prețurile (doar invitație la întâlnire)</span></label><label><span>Data și ora</span><input type="datetime-local" class="ma" value="'+(o.meet_at?loc(o.meet_at):'')+'"></label><label><span>Platforma</span><select class="mp"><option'+(o.meet_platform==='Zoom'?'':' selected')+'>Google Meet</option><option'+(o.meet_platform==='Zoom'?' selected':'')+'>Zoom</option></select></label><label><span>Link</span><input type="text" class="ml" value="'+esc(o.meet_link||'')+'" placeholder="https://"></label><button type="button" class="abtn y" style="font-size:12px;padding:9px 14px">Salvează</button> <span class="ms" style="font-size:12px"></span>';
  box.querySelector('.abtn').addEventListener('click',function(){var sb=this,ms=box.querySelector('.ms'),on=box.querySelector('.mm').checked,v=box.querySelector('.ma').value;sb.disabled=true;ms.textContent='Se salvează…';
   api('/rest/v1/offers?id=eq.'+o.id,{m:'PATCH',b:{mode:on?'meet':'offer',meet_at:v?new Date(v).toISOString():null,meet_platform:box.querySelector('.mp').value,meet_link:box.querySelector('.ml').value.trim()||null}}).then(function(j){if(!j||!j[0])throw 0;ms.textContent='Salvat ✓';setTimeout(function(){if(typeof window.ofrTab==='function')window.ofrTab('list')},1000)}).catch(function(e){sb.disabled=false;ms.textContent=e==='login'?'Sesiunea a expirat: reîncarcă pagina':'Nu s-a salvat'})})})})}

function hook(){var tb=document.getElementById('ofrTbody');if(!tb)return setTimeout(hook,400);new MutationObserver(function(m){if(m.some(function(x){return [].some.call(x.addedNodes,function(n){return n.nodeType===1&&!n.classList.contains('oedr')})})){clearTimeout(t);t=setTimeout(refresh,400)}}).observe(tb,{childList:true});refresh()}
